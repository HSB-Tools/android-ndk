name: Make NDK (reusable)
on:
  workflow_call:
    inputs:
      platform:
        description: "bionic | linux | bsd | windows | macos"
        required: true
        type: string
      targets:
        description: "JSON array of target triples"
        required: true
        type: string
      only:
        description: "JSON array replacing targets, when set"
        required: false
        type: string
        default: ""
      version:
        required: true
        type: string
      revision:
        required: false
        type: string
        default: ""
      release_suffix:
        description: "Suffix appended to the release tag after '+' (default: short commit sha)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.only != '' && inputs.only || inputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /mnt

      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          sudo rsync -aqP /var/lib/docker/ /mnt/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - name: Prepare /mnt/build
        run: |
          sudo mkdir -p /mnt/build
          sudo chown $(id -u):$(id -g) /mnt/build
          rmdir "$GITHUB_WORKSPACE"
          ln -s /mnt/build "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make NDK
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ndk-builder:latest"
          # REPO_OWNER must name the owner that has the llvm-custom releases and
          # zig-as-llvm. Both live only under HomuHomu833, and make-ndk.sh fetches
          # ${REPO_OWNER}/llvm-custom/releases for the whole toolchain -- passing
          # this repo's owner would 404 every LLVM download.
          docker run --rm \
            -v "/mnt/build:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            -e PLATFORM='${{ inputs.platform }}' \
            -e TARGET='${{ matrix.target }}' \
            -e NDK_VERSION='${{ inputs.version }}' \
            -e NDK_REVISION='${{ inputs.revision }}' \
            -e ROOTDIR=/work \
            -e REPO_OWNER='HomuHomu833' \
            "$IMAGE" \
            bash -c 'scripts/make-ndk.sh'

      - name: Set artifact name
        run: |
          ext="tar.xz"; [ "${{ inputs.platform }}" = windows ] && ext="7z"
          echo "ARTIFACT=android-ndk-r${{ inputs.version }}${{ inputs.revision }}-${{ matrix.target }}.${ext}" >> "$GITHUB_ENV"

      # The release tag must identify the exact build. Historically it was just
      # `r<version>`, so the pre-splice and post-splice tarballs shared one tag
      # and were indistinguishable -- a consumer pinning r30 had no way to tell
      # the broken build from the fixed one. Append a suffix after '+': the
      # release_suffix input when set, otherwise the short commit sha, so every
      # commit gets a unique, traceable tag and old tags are never rewritten.
      - name: Compute release tag
        run: |
          suffix='${{ inputs.release_suffix }}'
          if [ -z "$suffix" ]; then
            suffix="$(git rev-parse --short=8 HEAD)"
          fi
          echo "RELEASE_TAG=r${{ inputs.version }}+${suffix}" >> "$GITHUB_ENV"
          echo "release tag: r${{ inputs.version }}+${suffix}"

      - name: Release
        uses: ncipollo/release-action@v1.21.0
        with:
          name: "${{ env.RELEASE_TAG }}"
          tag: "${{ env.RELEASE_TAG }}"
          artifacts: ${{ github.workspace }}/${{ env.ARTIFACT }}
          allowUpdates: true
          replacesArtifacts: true
          body: 'Built from ${{ github.sha }}'
