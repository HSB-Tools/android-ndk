name: Build builder image
on:
  workflow_dispatch:
  push:
    paths:
      - docker/Dockerfile
      - .github/workflows/docker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Lowercase repository owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # REPO_OWNER names the owner that has zig-as-llvm. It lives only in
          # HomuHomu833, not the fork org, and the Dockerfile clones
          # github.com/${REPO_OWNER}/zig-as-llvm -- pointing it at the fork org
          # makes git ask for credentials on a 404 and kills the image build.
          context: ./docker
          push: true
          build-args: |
            REPO_OWNER=HomuHomu833
          tags: ghcr.io/${{ env.OWNER }}/ndk-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
